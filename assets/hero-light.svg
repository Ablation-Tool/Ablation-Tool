<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="hero-light-title hero-light-desc">
  <title id="hero-light-title">Nicholas Michael Kloster — Independent Researcher &amp; Architect of Zoe</title>
  <desc id="hero-light-desc">Building Zoe — Operational Metacognition, Self-Governing Autonomy, and Volumetric Visual Computing.</desc>
  <defs>
    <linearGradient id="bg-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAFBFD"/>
      <stop offset="100%" stop-color="#F3F5F8"/>
    </linearGradient>
    <pattern id="grid-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#D8DEE8" stroke-opacity="0.65" stroke-width="1"/>
    </pattern>
    <clipPath id="panel-clip-light">
      <rect x="756" y="34" width="408" height="252" rx="10"/>
    </clipPath>
  </defs>

  <!-- Outer card -->
  <rect x="1" y="1" width="1198" height="318" rx="14" fill="url(#bg-light)" stroke="#D8DEE8" stroke-width="1"/>

  <!-- Left vertical crimson architectural bar -->
  <rect x="44" y="46" width="4" height="228" rx="2" fill="#E10600"/>

  <!-- Left typographic column -->
  <text x="68" y="74" fill="#E10600" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2.4">INDEPENDENT RESEARCHER · ARCHITECT OF ZOE</text>
  <text x="66" y="132" fill="#0F141C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.0">Nicholas Michael Kloster</text>
  <text x="68" y="168" fill="#4B5563" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17">Building Zoe — Operational Metacognition, Self-Governing Autonomy</text>
  <text x="68" y="192" fill="#4B5563" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17">&amp; Volumetric Visual Computing</text>

  <line x1="68" y1="214" x2="700" y2="214" stroke="#D8DEE8" stroke-width="1"/>

  <!-- Domain tags -->
  <text x="68" y="242" fill="#0F141C" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.8">ACCESSIBLE VOLUME</text>
  <circle cx="222" cy="238" r="2.5" fill="#E10600"/>
  <text x="236" y="242" fill="#0F141C" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.8">SPECTRAL FILTRATION</text>
  <circle cx="408" cy="238" r="2.5" fill="#E10600"/>
  <text x="422" y="242" fill="#0F141C" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.8">DOROTHY ATLAS</text>
  <circle cx="545" cy="238" r="2.5" fill="#E10600"/>
  <text x="559" y="242" fill="#0F141C" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.8">AIARE</text>

  <!-- Footer metadata -->
  <text x="68" y="272" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">Ablation-Tool/zoe  ·  18 Research Papers  ·  359 Visuals  ·  6 Credited CVEs</text>

  <!-- Right scientific visualization panel -->
  <rect x="756" y="34" width="408" height="252" rx="10" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1"/>
  <g clip-path="url(#panel-clip-light)">
    <rect x="756" y="34" width="408" height="252" fill="url(#grid-light)"/>
  </g>

  <text x="778" y="60" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" letter-spacing="1.0">ACCESSIBLE VOLUME FILTRATION</text>
  <text x="1142" y="60" text-anchor="end" fill="#E10600" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700">A_τ(p) = 5</text>

  <!-- Plot axes -->
  <line x1="786" y1="82" x2="786" y2="236" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="786" y1="236" x2="1132" y2="236" stroke="#CBD5E1" stroke-width="1"/>

  <!-- 12 monotonically descending probability bars -->
  <rect x="796" y="98" width="18" height="138" rx="2" fill="#E10600" fill-opacity="0.14" stroke="#E10600" stroke-opacity="0.45" stroke-width="1"/>
  <rect x="796" y="98" width="18" height="3" rx="1" fill="#E10600"/>

  <rect x="824" y="114" width="18" height="122" rx="2" fill="#E10600" fill-opacity="0.13" stroke="#E10600" stroke-opacity="0.45" stroke-width="1"/>
  <rect x="824" y="114" width="18" height="3" rx="1" fill="#E10600"/>

  <rect x="852" y="130" width="18" height="106" rx="2" fill="#E10600" fill-opacity="0.12" stroke="#E10600" stroke-opacity="0.45" stroke-width="1"/>
  <rect x="852" y="130" width="18" height="3" rx="1" fill="#E10600"/>

  <rect x="880" y="146" width="18" height="90" rx="2" fill="#E10600" fill-opacity="0.11" stroke="#E10600" stroke-opacity="0.45" stroke-width="1"/>
  <rect x="880" y="146" width="18" height="3" rx="1" fill="#E10600"/>

  <rect x="908" y="158" width="18" height="78" rx="2" fill="#E10600" fill-opacity="0.10" stroke="#E10600" stroke-opacity="0.45" stroke-width="1"/>
  <rect x="908" y="158" width="18" height="3" rx="1" fill="#E10600"/>

  <!-- Remaining 7 bars below threshold -->
  <rect x="936" y="178" width="18" height="58" rx="2" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="964" y="190" width="18" height="46" rx="2" fill="#E2E8F0" fill-opacity="0.85" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="992" y="200" width="18" height="36" rx="2" fill="#E2E8F0" fill-opacity="0.75" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="1020" y="208" width="18" height="28" rx="2" fill="#E2E8F0" fill-opacity="0.65" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="1048" y="214" width="18" height="22" rx="2" fill="#E2E8F0" fill-opacity="0.55" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="1076" y="220" width="18" height="16" rx="2" fill="#E2E8F0" fill-opacity="0.45" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="1104" y="225" width="18" height="11" rx="2" fill="#E2E8F0" fill-opacity="0.40" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Smooth envelope curve -->
  <path d="M 805 98 Q 847 122 889 146 T 945 178 T 1029 208 T 1113 225" fill="none" stroke="#0F141C" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Threshold line -->
  <line x1="782" y1="164" x2="1124" y2="164" stroke="#E10600" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="1132" y="168" fill="#E10600" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">τ</text>

  <!-- Bottom axis caption -->
  <text x="786" y="262" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">p(x) &gt; τ  ·  RANKED HYPOTHESIS SPACE X</text>
</svg>
