      <stop offset="0%" stop-color="#F6F2E9"/>
      <stop offset="100%" stop-color="#EFE9DC"/>
    </linearGradient>
    <linearGradient id="coneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
