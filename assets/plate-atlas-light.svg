<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Plate 02: The Zoe Research Manifold linking mathematical substrates, autonomy, scientific and security instruments, and open scientific record.">
  <defs>
