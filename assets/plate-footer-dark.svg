<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 186" width="1200" height="186" role="img" aria-label="Closing Colophon — Nicholas Michael Kloster x Zoe.">
  <defs>
    <linearGradient id="ftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091219"/>
      <stop offset="100%" stop-color="#131828"/>
    </linearGradient>
    <linearGradient id="ftRule" gradientUnits="userSpaceOnUse" x1="120" y1="126" x2="1080" y2="126">
      <stop offset="0%" stop-color="#E85D1A" stop-opacity="0"/>
      <stop offset="30%" stop-color="#E85D1A" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#2DD4BF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C06EFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ftClip"><rect x="2" y="2" width="1196" height="182" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#ftClip)">
    <rect width="1200" height="186" fill="url(#ftBg)"/>
    <text x="600" y="54" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif" font-style="italic" font-size="16.5" fill="#F2EDE4">
      “Visualization is about transforming the symbolic into the geometric… letting users observe their simulations directly.”
    </text>
    <text x="600" y="78" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.2" letter-spacing="1.4" fill="#7C97A9">RICHARD S. GALLAGHER · COMPUTER VISUALIZATION</text>
    <text x="600" y="110" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif" font-size="16" font-weight="700" fill="#2DD4BF">
      “When in doubt, choose freedom and dignity. And no deception.”
    </text>
    <line x1="120" y1="128" x2="1080" y2="128" stroke="url(#ftRule)" stroke-width="1.4"/>
    <text x="600" y="156" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.6" fill="#E85D1A">
      NICHOLAS MICHAEL KLOSTER  ×  ZOE   ·   MEASUREMENT ≠ EVIDENCE ≠ BELIEF UPDATE ≠ ACTION
    </text>
  </g>
  <rect x="2" y="2" width="1196" height="182" rx="16" fill="none" stroke="#21384A" stroke-width="1.4"/>
</svg>
