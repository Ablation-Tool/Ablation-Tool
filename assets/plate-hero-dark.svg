  <title id="hero-title-dark">Nicholas Michael Kloster — Independent Researcher &amp; Architect of Zoe</title>
  <desc id="hero-desc-dark">Scientific plate showing Accessible Volume filtration streamribbons and research overview.</desc>
  <defs>
    <linearGradient id="bg-hero-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#132028"/>
      <stop offset="100%" stop-color="#0C151B"/>
    </linearGradient>
    <linearGradient id="name-grad-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="55%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#DC3D1F"/>
    </linearGradient>
    <linearGradient id="laminar-grad-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="wake-pass-grad-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="52%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
    <clipPath id="vp-clip-dark">
      <rect x="572" y="30" width="594" height="320" rx="10"/>
    </clipPath>
  </defs>

  <!-- Outer archival folio card -->
  <rect x="1" y="1" width="1198" height="378" rx="14" fill="url(#bg-hero-dark)" stroke="#2A4252" stroke-width="1.2"/>

  <!-- Left editorial typography column (x=48..540) -->
  <text x="48" y="54" fill="#2DD4BF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1.6">PLATE 01  ·  SCIENTIFIC VISUALIZATION &amp; AUTONOMOUS INTELLIGENCE</text>

  <!-- Gallagher double-hairline ruled overline -->
  <line x1="48" y1="70" x2="528" y2="70" stroke="#EA580C" stroke-width="1.2"/>
  <text x="48" y="89" fill="#F4EFE6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" font-style="italic" letter-spacing="0.4">Independent Researcher  ·  Architect of Zoe</text>
  <line x1="48" y1="98" x2="528" y2="98" stroke="#EA580C" stroke-width="1.2"/>

  <!-- Monumental two-line display title -->
  <text x="46" y="154" fill="#F4EFE6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="45" font-weight="700" letter-spacing="-1.2">Nicholas Michael</text>
  <text x="46" y="203" fill="url(#name-grad-dark)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="45" font-weight="700" letter-spacing="-1.2">Kloster</text>

  <!-- Subtitle -->
  <text x="48" y="239" fill="#A3B8C4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5">Operational Metacognition, Self-Governing Autonomy</text>
  <text x="48" y="262" fill="#A3B8C4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5">&amp; Volumetric Visual Computing</text>

  <!-- Italic serif epigraph -->
  <text x="48" y="298" fill="#2DD4BF" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-style="italic">“Transforming the symbolic into the geometric.”</text>

