<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="arch-light-title arch-light-desc">
  <title id="arch-light-title">Zoe Research Architecture</title>
  <desc id="arch-light-desc">Measurement foundations feeding the Zoe self-governing core, applied research instruments, and open scientific record.</desc>
  <defs>
    <linearGradient id="arch-bg-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAFBFD"/>
      <stop offset="100%" stop-color="#F3F5F8"/>
    </linearGradient>
    <marker id="arrow-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#E10600"/>
    </marker>
    <clipPath id="hero-card-clip-light">
      <rect x="420" y="66" width="360" height="302" rx="10"/>
    </clipPath>
  </defs>

  <!-- Outer card -->
  <rect x="1" y="1" width="1198" height="398" rx="14" fill="url(#arch-bg-light)" stroke="#D8DEE8" stroke-width="1"/>

  <!-- Top bar -->
  <text x="36" y="38" fill="#E10600" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2.0">ZOE RESEARCH ARCHITECTURE</text>
  <text x="1164" y="38" text-anchor="end" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">MEASUREMENT  →  SELF-GOVERNING CORE  →  INSTRUMENTS &amp; RECORD</text>
  <line x1="36" y1="50" x2="1164" y2="50" stroke="#D8DEE8" stroke-width="1"/>

  <!-- Left Column: Card L1 -->
  <rect x="36" y="66" width="320" height="138" rx="10" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1"/>
  <text x="56" y="92" fill="#E10600" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.2">01 / MATHEMATICAL FOUNDATION</text>
  <text x="56" y="116" fill="#0F141C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Accessible Volume &amp; Filtration</text>
  <text x="56" y="138" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">Ablation-Tool/next-token-predictability</text>
  <text x="56" y="164" fill="#4B5563" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Strict threshold counting A_τ(p)</text>
  <text x="56" y="183" fill="#4B5563" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Kloster Spectral Filtration H(p), M_k(p)</text>

  <!-- Left Column: Card L2 -->
  <rect x="36" y="230" width="320" height="138" rx="10" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1"/>
  <text x="56" y="256" fill="#E10600" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.2">02 / SELF-GOVERNING ENGINE</text>
  <text x="56" y="280" fill="#0F141C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Zoe Autonomy</text>
  <text x="56" y="302" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">Ablation-Tool/Zoe-Autonomy</text>
  <text x="56" y="328" fill="#4B5563" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Event-causal perception &amp; guarded loop</text>
  <text x="56" y="347" fill="#4B5563" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">L4 sandboxed AST self-evolution</text>

  <!-- Vertical arrow L1 -> L2 -->
  <line x1="196" y1="204" x2="196" y2="226" stroke="#E10600" stroke-width="1.5" marker-end="url(#arrow-light)"/>

  <!-- Center Column: Flagship Hero Card -->
  <rect x="420" y="66" width="360" height="302" rx="10" fill="#FFFFFF" stroke="#E10600" stroke-width="1.5"/>
  <rect x="420" y="66" width="360" height="5" fill="#E10600" clip-path="url(#hero-card-clip-light)"/>

  <text x="444" y="96" fill="#E10600" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1.8">FLAGSHIP UNIFIED MONOREPO</text>
  <text x="444" y="132" fill="#0F141C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Zoe</text>
  <text x="508" y="130" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">Ablation-Tool/zoe</text>
  <text x="444" y="158" fill="#4B5563" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Research, visual computing &amp; autonomous intelligence</text>

  <line x1="444" y1="176" x2="756" y2="176" stroke="#E2E8F0" stroke-width="1"/>

  <rect x="444" y="195" width="7" height="7" rx="1.5" fill="#E10600"/>
  <text x="460" y="204" fill="#0F141C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">13 runtime source projects · No submodules</text>

  <rect x="444" y="223" width="7" height="7" rx="1.5" fill="#E10600"/>
  <text x="460" y="232" fill="#0F141C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">17 registered engines · 36 canonical GEM layers</text>

  <rect x="444" y="251" width="7" height="7" rx="1.5" fill="#E10600"/>
  <text x="460" y="260" fill="#0F141C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">Native GEM workbench (gem · brain-gem · helen)</text>

  <rect x="444" y="279" width="7" height="7" rx="1.5" fill="#E10600"/>
  <text x="460" y="288" fill="#0F141C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">Reproducible verification · Zero-deception ethos</text>

  <!-- Bottom pill bar -->
  <rect x="444" y="312" width="312" height="34" rx="6" fill="#E10600" fill-opacity="0.10" stroke="#E10600" stroke-opacity="0.35" stroke-width="1"/>
  <text x="600" y="333" text-anchor="middle" fill="#0F141C" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="0.6">METACOGNITION · STAGE 4 MARS · STAGE 5 L4</text>

  <!-- Right Column: Card R1 -->
  <rect x="844" y="66" width="320" height="138" rx="10" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1"/>
  <text x="864" y="92" fill="#E10600" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.2">03 / APPLIED RESEARCH INSTRUMENTS</text>
  <text x="864" y="116" fill="#0F141C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Science, Forensics &amp; Security</text>
  <text x="864" y="138" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">Dorothy · CERN/HELIOS · Ablation · Kevlar</text>
  <text x="864" y="164" fill="#4B5563" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Preclinical CCFv3 volumetric neuro-atlas</text>
  <text x="864" y="183" fill="#4B5563" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">AIARE reverse engineering, PALA &amp; Cerotto</text>

  <!-- Right Column: Card R2 -->
  <rect x="844" y="230" width="320" height="138" rx="10" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1"/>
  <text x="864" y="256" fill="#E10600" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.2">04 / OPEN SCIENTIFIC RECORD</text>
  <text x="864" y="280" fill="#0F141C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Papers, Archive &amp; Integrity</text>
  <text x="864" y="302" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">research-papers · zoe-visual-archive</text>
  <text x="864" y="328" fill="#4B5563" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">18 manuscripts · 87-page unified monograph</text>
  <text x="864" y="347" fill="#4B5563" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">359 explained visuals · PKCS #7 signatures</text>

  <!-- Horizontal coupling arrows -->
  <line x1="356" y1="135" x2="414" y2="135" stroke="#E10600" stroke-width="1.5" marker-end="url(#arrow-light)"/>
  <line x1="356" y1="299" x2="414" y2="299" stroke="#E10600" stroke-width="1.5" marker-end="url(#arrow-light)"/>
  <line x1="780" y1="135" x2="838" y2="135" stroke="#E10600" stroke-width="1.5" marker-end="url(#arrow-light)"/>
  <line x1="780" y1="299" x2="838" y2="299" stroke="#E10600" stroke-width="1.5" marker-end="url(#arrow-light)"/>
</svg>
